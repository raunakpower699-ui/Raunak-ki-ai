name: Build & Release Debug APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build & Publish APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build Debug APK
        run: ./gradlew assembleDebug --no-daemon

      - name: Upload Debug APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      - name: Publish GitHub Release
        id: publish_release
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG_NAME: v1.0.0-run.${{ github.run_number }}.${{ github.run_attempt }}
          COMMIT_SHA: ${{ github.sha }}
        run: |
          gh release create "$TAG_NAME" \
            app/build/outputs/apk/debug/app-debug.apk \
            --target "$COMMIT_SHA" \
            --title "Debug Build $TAG_NAME" \
            --notes "Automated debug APK build from commit $COMMIT_SHA" \
            --latest

      - name: Generate Workflow Summary
        if: always()
        run: |
          echo "## Build & Release Summary" >> $GITHUB_STEP_SUMMARY
          echo "- **APK File Path**: \`app/build/outputs/apk/debug/app-debug.apk\`" >> $GITHUB_STEP_SUMMARY
          echo "- **Actions Artifact Name**: \`app-debug-apk\`" >> $GITHUB_STEP_SUMMARY
          echo "- **Release Tag**: \`v1.0.0-run.${{ github.run_number }}.${{ github.run_attempt }}\`" >> $GITHUB_STEP_SUMMARY
          echo "- **Release Asset**: \`app-debug.apk\` (direct .apk binary)" >> $GITHUB_STEP_SUMMARY
          echo "- **Commit Target**: \`${{ github.sha }}\`" >> $GITHUB_STEP_SUMMARY
          if [ "${{ steps.publish_release.outcome }}" = "success" ]; then
            echo "- **Release Publishing Status**: :white_check_mark: Succeeded" >> $GITHUB_STEP_SUMMARY
          else
            echo "- **Release Publishing Status**: :x: Failed or Skipped" >> $GITHUB_STEP_SUMMARY
          fi
